name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, test and flake check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: just lint
        run: nix develop .#ci --command just lint
      - name: just test
        run: nix develop .#ci --command just test
      - name: just test-capture
        # The runner's kernel doesn't let Chromium build its sandbox.
        env:
          VIDNI_NO_SANDBOX: "1"
        run: nix develop .#ci --command just test-capture
      - name: just test-hear
        run: nix develop .#ci --command just test-hear
      - name: just test-record
        run: nix develop .#ci --command just test-record
      - name: just test-build
        env:
          VIDNI_NO_SANDBOX: "1"
        # --offline makes a user namespace, which the runner's AppArmor
        # forbids until this setting allows it.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          nix develop .#ci --command just test-build
      - name: just test-app
        env:
          VIDNI_NO_SANDBOX: "1"
        run: nix develop .#ci --command just test-app
      - name: just example hello
        env:
          VIDNI_NO_SANDBOX: "1"
        run: nix develop .#ci --command just example hello
      - name: just reference-frozen
        run: nix develop .#ci --command just reference-frozen
      - name: just keys check
        run: nix develop .#ci --command just keys check
      - name: just notices check
        run: nix develop .#ci --command just notices check
      - name: nix flake check
        run: nix flake check
