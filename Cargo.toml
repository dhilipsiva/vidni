[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dhilipsiva/vidni"
authors = ["dhilipsiva <dhilipsiva@pm.me>"]

# The tests draw whole frames, decode pictures and hash files, and an
# unoptimized build takes many times as long over them. So the media crate
# and every dependency are optimized in dev builds too.
[profile.dev.package.vidni-media]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
