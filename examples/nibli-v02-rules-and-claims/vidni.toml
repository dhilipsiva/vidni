schema = 1
[meta]
title = "Writing Rules and Evaluating Claims"
subtitle = "Reasoning from First Principles"
language = "en"
strict = true
default_scene = "shop"

[voice]
draft = "piper:en_US-joe-medium"
length_scale = 1.04
respell = [{ text = "Nibli KR", say = "Nibbly K R" }, { text = "Nibli", say = "Nibbly" }, { text = "Parcel A", say = "Parcel, A" }]
heard_as = [{ heard = "nibbly", means = "nibli" }, { heard = "nibley", means = "nibli" }]

[emphasis]
min_duration = 3.0

[timing]
lead_in = 0.6
line_gap = 0.32
section_gap = 0.65
tail = 1.2

[style]
theme = "../themes/quine"

[lint]
banned = ['\bask(?:s|ed|ing)?\b', '\bquestions?\b', '\bpause and\b', '\bpredict\b', 'UNDETERMINED']

[[cuts]]
id = "long"
aspect = "16:9"
captions = "both"
platforms = ["youtube"]

[[cuts]]
id = "short"
aspect = "9:16"
captions = "burned"
platforms = ["youtube-shorts"]

[music]
track = "none"

[publish]
description = "Neuro-Symbolic Lesson 4 continues the parcel example with one shared variable, a checklist rule, claim evaluation and supporting derivations. Compare derived and given conclusions, then introduce every and some. The shop and its records are fictional."
tags = ["neuro-symbolic reasoning", "Nibli KR", "symbolic reasoning", "knowledge representation"]

[publish.titles]
youtube = "Writing Rules and Evaluating Claims | Neuro-Symbolic Lesson 4"
youtube-shorts = "Records Need a Rule | Neuro-Symbolic Lesson 4"

[sections.shop]
label = ""
chapter = "The checklist for the same parcel"

[sections.plain-rule]
label = ""
chapter = "Say the rule in ordinary language"

[sections.write-rule]
label = ""
chapter = "Write one rule with a shared variable"

[sections.first-evaluation]
label = ""
chapter = "Supply the rule and evaluate the claim"

[sections.derivation]
label = ""
chapter = "Add a record and follow the derivation"

[sections.controls]
label = ""
chapter = "Compare derived and given support"

[sections.some]
label = ""
chapter = "Every case and at least one example"

[sections.parcel-b]
label = ""
chapter = "Apply the same rule to Parcel B"

[sections.closing]
label = ""
chapter = "What the conclusion rests on"

[sections.short-story]
label = ""
chapter = ""

