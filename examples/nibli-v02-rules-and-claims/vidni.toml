id = "v02-parcel-b-04"
section = "parcel-b"
show = "Both parcels now qualify. Evaluating the some-object claim still returns TRUE. At least one includes the case where both qualify."
scene = "pg-17-some-both"
source = "notes.md#v02-parcel-b"
only = ["long"]
emphasis = [{ id = "focus-1", target = "true", phrase = "TRUE" }]
camera = "result"
camera_vertical = "result"

[[lines]]
id = "v02-parcel-b-05"
section = "parcel-b"
show = "In ordinary conversation, some can suggest not all. That extra suggestion is not part of this formal claim."
scene = "b-record"
source = "notes.md#v02-parcel-b"
only = ["long"]
emphasis = [{ id = "focus-1", target = "some", phrase = "not all" }]

[[lines]]
id = "v02-closing-01"
section = "closing"
show = "We began with two separate records and one everyday requirement. A shared variable kept each parcel together across both conditions."
scene = "closing"
source = "notes.md#v02-closing"
only = ["long"]
emphasis = [{ id = "focus-1", target = "one", phrase = "shared variable" }]

[[lines]]
id = "v02-closing-02"
section = "closing"
show = "Once the right records were present, the rule supported a conclusion we had never supplied as a premise. The derivation showed the connection."
scene = "closing"
source = "notes.md#v02-closing"
only = ["long"]
emphasis = [{ id = "focus-1", target = "two", phrase = "The derivation" }]

[[lines]]
id = "v02-closing-03"
section = "closing"
show = "And the some-object claim needed only one supported example, even when more than one was available."
scene = "closing"
source = "notes.md#v02-closing"
only = ["long"]
emphasis = [{ id = "focus-1", target = "three", phrase = "one supported example" }]

[[lines]]
id = "v02-closing-04"
section = "closing"
show = "This is the symbolic foundation of our neuro-symbolic course: make the starting information explicit, evaluate a claim, and inspect what supports it."
scene = "closing"
source = "notes.md#v02-closing"
only = ["long"]

[[lines]]
id = "v02-closing-05"
section = "closing"
show = "Next, we'll look at an argument place left empty, and why leaving it out differs from saying some value."
scene = "closing"
source = "notes.md#v02-closing"
only = ["long"]
emphasis = [{ id = "focus-1", target = "next", phrase = "left empty" }]

[[lines]]
id = "v02-short-story-01"
section = "short-story"
show = "A shop's dispatch checklist needs packing and label confirmations for the same parcel."
scene = "short-shop"
source = "notes.md#v02-short-story"
only = ["short"]
emphasis = [{ id = "focus-1", target = "label", phrase = "packing and label" }]

[[lines]]
id = "v02-short-story-02"
section = "short-story"
show = "Parcel A has a packing record and the checklist rule, but no label record."
scene = "short-shop"
source = "notes.md#v02-short-story"
only = ["short"]
emphasis = [{ id = "focus-1", target = "detail", phrase = "Parcel A" }]

[[lines]]
id = "v02-short-story-03"
section = "short-story"
show = "For the claim that A meets the checklist, the verdict is FALSE. That means unsupported by these records, not proof that a label was never attached."
scene = "pg-18-short-missing"
source = "notes.md#v02-short-story"
only = ["short"]
emphasis = [{ id = "focus-1", target = "false", phrase = "FALSE" }]
camera = "result"
camera_vertical = "result"

[[lines]]
id = "v02-short-story-04"
section = "short-story"
show = "A new label confirmation arrives for A. We add that record as a premise; the checklist rule stays the same."
scene = "short-new"
source = "notes.md#v02-short-story"
only = ["short"]
emphasis = [{ id = "focus-1", target = "label", phrase = "for A" }]

[[lines]]
id = "v02-short-story-05"
section = "short-story"
show = "The TRUE result now follows from both records and the checklist rule."
scene = "pg-19-short-derived"
source = "notes.md#v02-short-story"
only = ["short"]
emphasis = [{ id = "focus-1", target = "true", phrase = "TRUE" }]
camera = "short-proof"
camera_vertical = "short-proof"

[[lines]]
id = "v02-short-story-06"
section = "short-story"
show = "Without the rule, FALSE returns. Both records remain, but the connection is missing."
scene = "pg-20-short-no-rule"
source = "notes.md#v02-short-story"
only = ["short"]
emphasis = [{ id = "focus-1", target = "false", phrase = "FALSE" }]
camera = "result"
camera_vertical = "result"

[[lines]]
id = "v02-short-story-07"
section = "short-story"
show = "A missing record and a missing rule are different gaps in what supports the conclusion."
scene = "short-rule"
source = "notes.md#v02-short-story"
only = ["short"]
emphasis = [{ id = "focus-1", target = "label", phrase = "missing record" }, { id = "focus-2", target = "detail", phrase = "and a missing rule" }]

[[lines]]
id = "v02-short-story-08"
section = "short-story"
show = "Follow the support: records supply the information, and the rule connects it to the conclusion."
scene = "short-close"
source = "notes.md#v02-short-story"
only = ["short"]
emphasis = [{ id = "focus-1", target = "label", phrase = "Follow the support" }]

