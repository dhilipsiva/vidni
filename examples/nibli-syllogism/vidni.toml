#:schema ../../docs/vidni.schema.json
# The nibli syllogism explainer, converted from the reference pipeline's
# segments.json (P2-VIDNI-01). docs/spec.md describes every key.

schema = 1

[meta]
title = "nibli: the LLM drafts, the engine decides"
subtitle = "nibli · the syllogism walkthrough"
language = "en"
default_scene = "playground"

[meta.in.ta]
title = "nibli: LLM வரைகிறது, இயந்திரம் தீர்மானிக்கிறது"

[voice]
draft = "piper:en_US-joe-medium"
length_scale = 1.0
# How a reader says the symbols the captions show.
read_as = [
  { text = "dhilipsiva.dev/nibli-playground", say = "dhilipsiva dot dev slash nibli playground" },
  { text = "RESOURCE_EXCEEDED", say = "resource exceeded" },
  { text = "#1", say = "number one" },
  { text = "#0", say = "number zero" },
]
# Spellings the draft voice says better.
respell = [
  { text = "dhilipsiva.dev/nibli-playground", say = "Dhilip Siva dot dev, slash nibli playground" },
  { text = "dhilipsiva", say = "Dhilip Siva" },
  { text = "nibli KR", say = "nibli K R" },
  { text = "theorem prover", say = "theorem proover" },
  { text = "RESOURCE_EXCEEDED", say = "resource exceeded" },
  { text = "AI Engineers", say = "A I Engineers" },
  { text = "source #1", say = "source number one" },
  { text = "source #0", say = "source number zero" },
]
# Words the listening check hears spelled differently for the same sound.
heard_as = [
  { heard = "atom", means = "adam" },
  { heard = "atoms", means = "adams" },
  { heard = "roll", means = "role" },
  { heard = "y", means = "why" },
  { heard = "nibbly", means = "nibli" },
  { heard = "nibley", means = "nibli" },
  { heard = "nibali", means = "nibli" },
  { heard = "site's", means = "cites" },
  { heard = "sites", means = "cites" },
]

[timing]
lead_in = 0.6
line_gap = 0.28
section_gap = 0.75
tail = 2.4

# The wording rules of nibli's canonical facts: no line may show or say these.
[lint]
banned = [
  'zero[- ]hallucination',
  'no hallucination',
  'cannot hallucinate',
  'guarantee',
  'machine[- ]checked',
  'verified engine',
  'high[- ]performance',
  '\bpublished\b',
  'UNDETERMINED',
  'sub[- ]millisecond',
  'LLM[^.]*\bcompil',
  '\bcompil\w*[^.]*\bLLM',
]

# The look: near-black, ember and Space Grotesk, as the reference drew it.
[style]
theme = "../themes/quine"

# The reference burns captions into both cuts. The vertical cut runs about
# five minutes, which is too long for the short-video platforms.
# The long cut is a clean master with caption files, and a variant with
# the captions drawn in (the default for 16:9).
[[cuts]]
id = "long"
aspect = "16:9"
platforms = ["youtube"]

[[cuts]]
id = "vertical"
aspect = "9:16"
captions = "burned"
platforms = []

# A short: its own opening and closing lines, around lines the long cut says too.
[[cuts]]
id = "short"
aspect = "9:16"
lines = [
  "short-hook",
  "nibli-1",
  "nibli-5",
  "syllogism-1",
  "syllogism-2",
  "syllogism-3",
  "syllogism-4",
  "syllogism-5",
  "reasoning-1",
  "reasoning-2",
  "reasoning-7",
  "short-end",
]

# The same video in Tamil: each line's `in.ta` words, in the creator's
# Tamil takes. Until those are recorded it drafts in eSpeak NG's Tamil.
[[cuts]]
id = "tamil"
aspect = "16:9"
language = "ta"

[music]
track = "none"

# What goes with each cut where it is uploaded. None of it is in a picture,
# so changing it renders nothing again: `vidni final` writes it afresh into
# each platform's folder under out/.
[publish]
description = """
A five-minute walkthrough of the Syllogism example in the nibli playground: \
what symbolic reasoning is, what a theorem prover does, where an LLM fits around one, \
and how nibli proves that Adam eats, step by step."""
tags = [
  "nibli",
  "theorem proving",
  "symbolic reasoning",
  "neuro-symbolic AI",
  "Rust",
  "WebAssembly",
]
links = [
  { label = "Try it", url = "https://dhilipsiva.dev/nibli-playground" },
  { label = "The code", url = "https://github.com/dhilipsiva/nibli" },
]
thumbnails = [
  { line = "trace-9", title = "A proof you can read" },
  { line = "false-2", title = "FALSE, and why" },
]

# The first and the last section show no label; each still names a chapter.
[sections.intro]
label = ""
chapter = "Intro"

[sections.symbolic]
label = "symbolic reasoning"

[sections.symbolic.in.ta]
label = "குறியீட்டுத் தர்க்கம்"

[sections.proving]
label = "theorem proving"

[sections.proving.in.ta]
label = "தேற்ற நிரூபணம்"

[sections.neurosymbolic]
label = "neuro-symbolic architecture"

[sections.neurosymbolic.in.ta]
label = "நியூரோ-சிம்பாலிக் கட்டமைப்பு"

[sections.nibli]
label = "nibli"
chapter = "nibli" # A chapter's title is the label with a capital; the engine's name has none.

[sections.nibli.in.ta]
label = "nibli"

[sections.syllogism]
label = "the syllogism"

[sections.syllogism.in.ta]
label = "syllogism"

[sections.reasoning]
label = "reasoning backward"

[sections.reasoning.in.ta]
label = "பின்னோக்கிய தர்க்கம்"

[sections.trace]
label = "building the proof trace"

[sections.trace.in.ta]
label = "நிரூபணத் தடம்"

[sections.false]
label = "a real FALSE"

[sections.false.in.ta]
label = "உண்மையான FALSE"

[sections.end]
label = ""
chapter = "Try it yourself"

[[lines]]
id = "short-hook"
section = "intro"
show = "Can a program show its reasoning? Here's a proof you can check, in under a minute."
scene = "hook"
only = ["short"]

[[lines]]
id = "intro-1"
section = "intro"
show = "Language models predict the next word. A reasoner derives the next step."
scene = "intro"

[lines.in.ta]
show = "மொழி மாதிரிகள் அடுத்த சொல்லைக் கணிக்கின்றன. தர்க்க இயந்திரம் அடுத்த படியை நிறுவுகிறது."

[[lines]]
id = "intro-2"
section = "intro"
show = "In five minutes: what symbolic reasoning is, what a theorem prover does, where an LLM fits around one, and a small proof in nibli, step by step."

[lines.in.ta]
show = "ஐந்து நிமிடங்களில்: குறியீட்டுத் தர்க்கம் என்றால் என்ன, தேற்ற நிரூபி என்ன செய்கிறது, அதைச் சுற்றி LLM எங்கே பொருந்துகிறது, nibli-இல் ஒரு சிறிய நிரூபணம், படிப்படியாக."

[[lines]]
id = "symbolic-1"
section = "symbolic"
show = "Symbolic reasoning works on explicit statements and explicit rules."
do = [{ click = "tab-kr" }]
highlight = ["kr"]
camera = "kb"

[lines.in.ta]
show = "குறியீட்டுத் தர்க்கம் வெளிப்படையான கூற்றுகள் மீதும் வெளிப்படையான விதிகள் மீதும் இயங்குகிறது."

[[lines]]
id = "symbolic-2"
section = "symbolic"
show = "Here are three: every dog is an animal, every animal eats, and Adam is a dog."
highlight = ["kr-line-1", "kr-line-3", "kr-line-5"]
camera = "kb"

[lines.in.ta]
show = "இதோ மூன்று: ஒவ்வொரு நாயும் ஒரு விலங்கு, ஒவ்வொரு விலங்கும் உண்ணும், Adam ஒரு நாய்."

[[lines]]
id = "symbolic-3"
section = "symbolic"
show = "Nothing is learned from examples, and nothing is guessed."
camera = "kb"

[lines.in.ta]
show = "எடுத்துக்காட்டுகளிலிருந்து எதுவும் கற்கப்படுவதில்லை, எதுவும் ஊகிக்கப்படுவதில்லை."

[[lines]]
id = "symbolic-4"
section = "symbolic"
show = "A conclusion counts only if it follows from these statements by fixed rules of inference."
highlight = ["kr-line-1", "kr-line-3", "kr-line-5"]
camera = "kb"

[lines.in.ta]
show = "நிலையான அனுமான விதிகளின்படி இந்தக் கூற்றுகளிலிருந்து பின்தொடர்ந்தால் மட்டுமே ஒரு முடிவு ஏற்கப்படும்."

[[lines]]
id = "symbolic-5"
section = "symbolic"
show = "Run it again tomorrow and you get the same answer, and you can inspect every step that produced it."
highlight = ["row-eats", "row-animal", "row-given"]
camera = "right"

[lines.in.ta]
show = "நாளை மீண்டும் இயக்கினாலும் அதே பதில் கிடைக்கும்; அதை உருவாக்கிய ஒவ்வொரு படியையும் நீங்கள் ஆராயலாம்."

[[lines]]
id = "proving-1"
section = "proving"
show = "A theorem prover automates that."

[lines.in.ta]
show = "தேற்ற நிரூபி அதைத் தானியக்கமாக்குகிறது."

[[lines]]
id = "proving-2"
section = "proving"
show = "You give it premises and a claim, and it searches for a proof: a chain of rule applications from the premises to the claim."
highlight = ["kr", "query-select"]
camera = "left"

[lines.in.ta]
show = "நீங்கள் அதற்கு முற்கோள்களையும் ஒரு கூற்றையும் கொடுக்கிறீர்கள்; அது ஒரு நிரூபணத்தைத் தேடுகிறது: முற்கோள்களிலிருந்து கூற்று வரை விதிகளைப் பயன்படுத்தும் ஒரு சங்கிலி."

[[lines]]
id = "proving-3"
section = "proving"
show = "If it finds one, the answer is TRUE, and it can show you the chain."
highlight = ["verdict", "row-eats", "row-animal", "row-given"]
camera = "right"

[lines.in.ta]
show = "அது ஒன்றைக் கண்டால், பதில் TRUE; அந்தச் சங்கிலியையும் அது காட்டும்."

[[lines]]
id = "proving-4"
section = "proving"
show = "That answer is sound with respect to what you encoded."
highlight = ["tree"]
camera = "proof"

[lines.in.ta]
show = "நீங்கள் குறியாக்கியதைப் பொறுத்தவரை அந்தப் பதில் சரியானது."

[[lines]]
id = "proving-5"
section = "proving"
show = "It doesn't make your premises true. It tells you what they commit you to."
highlight = ["kr-line-1", "kr-line-3", "kr-line-5"]
camera = "kb"

[lines.in.ta]
show = "அது உங்கள் முற்கோள்களை உண்மையாக்குவதில்லை. அவை உங்களை எதற்குக் கட்டுப்படுத்துகின்றன என்பதைச் சொல்கிறது."

[[lines]]
id = "proving-6"
section = "proving"
show = "nibli answers with one of four verdicts: TRUE; FALSE, meaning not derivable; UNKNOWN, with a reason; and RESOURCE_EXCEEDED, when a depth, fuel or memory budget runs out."
say = "nibli answers with one of four verdicts. TRUE. FALSE, meaning not derivable. UNKNOWN, with a reason. And RESOURCE_EXCEEDED, when a depth, fuel or memory budget runs out."
highlight = ["verdict"]
camera = "right"
overlay = "verdicts"

[lines.in.ta]
show = "nibli நான்கு தீர்ப்புகளில் ஒன்றைத் தருகிறது: TRUE; FALSE, அதாவது நிறுவ முடியாதது; UNKNOWN, காரணத்துடன்; RESOURCE_EXCEEDED, ஆழம், எரிபொருள் அல்லது நினைவக வரம்பு தீரும்போது."
say = "nibli நான்கு தீர்ப்புகளில் ஒன்றைத் தருகிறது. TRUE. FALSE, அதாவது நிறுவ முடியாதது. UNKNOWN, காரணத்துடன். resource exceeded, ஆழம், எரிபொருள் அல்லது நினைவக வரம்பு தீரும்போது."

[[lines]]
id = "neurosymbolic-1"
section = "neurosymbolic"
show = "A neuro-symbolic system pairs a neural front end with a symbolic core, and lets each do what it's good at."
do = [{ click = "tab-source" }]
camera = "kb"

[lines.in.ta]
show = "நியூரோ-சிம்பாலிக் அமைப்பு ஒரு நரம்பியல் முன்முனையை ஒரு குறியீட்டு மையத்துடன் இணைத்து, ஒவ்வொன்றும் தான் சிறப்பாகச் செய்வதைச் செய்ய விடுகிறது."

[[lines]]
id = "neurosymbolic-2"
section = "neurosymbolic"
show = "Language models are good at reading prose."
highlight = ["source-text"]
camera = "kb"

[lines.in.ta]
show = "மொழி மாதிரிகள் உரைநடையைப் படிப்பதில் சிறந்தவை."

[[lines]]
id = "neurosymbolic-3"
section = "neurosymbolic"
show = "So in nibli, an LLM can formalize plain English into nibli KR, the engine's rule language."
highlight = ["source-text", "formalize"]
camera = "kb"

[lines.in.ta]
show = "எனவே nibli-இல், ஒரு LLM எளிய ஆங்கிலத்தை nibli KR ஆக, அதாவது இயந்திரத்தின் விதி மொழியாக, முறைப்படுத்த முடியும்."

[[lines]]
id = "neurosymbolic-4"
section = "neurosymbolic"
show = "That draft sits outside the reasoning firewall."
highlight = ["formalize"]
camera = "kb"
overlay = "firewall"

[lines.in.ta]
show = "அந்த வரைவு தர்க்கத் தீச்சுவருக்கு வெளியே இருக்கிறது."

[[lines]]
id = "neurosymbolic-5"
section = "neurosymbolic"
show = "Before anything reasons over it, deterministic gates check it."
do = [{ click = "tab-kr" }]
highlight = ["kr", "kb-status"]
camera = "kb"
overlay = "firewall"

[lines.in.ta]
show = "அதன் மீது எதுவும் தர்க்கம் செய்வதற்கு முன், நிர்ணயமான வாயில்கள் அதைச் சரிபார்க்கின்றன."

[[lines]]
id = "neurosymbolic-6"
section = "neurosymbolic"
show = "The grammar. A committed vocabulary, where an unknown word is an error instead of a guess. The semantic compiler. And a round trip back to canonical text."
highlight = ["kr"]
camera = "kb"
overlay = "firewall"

[lines.in.ta]
show = "இலக்கணம். உறுதிசெய்யப்பட்ட சொற்களஞ்சியம்; அதில் தெரியாத சொல் ஊகம் அல்ல, பிழை. பொருள் தொகுப்பி. நியம உரைக்குத் திரும்பும் ஒரு சுற்றுப் பயணம்."

[[lines]]
id = "neurosymbolic-7"
section = "neurosymbolic"
show = "Then a person reviews the rules and their back-translation: a fixed, mechanical reading, with no model involved."
do = [{ click = "tab-back-translation" }]
highlight = ["bt-line-0", "bt-line-1", "bt-line-2"]
camera = "kb"

[lines.in.ta]
show = "பிறகு ஒருவர் விதிகளையும் அவற்றின் மீள்மொழிபெயர்ப்பையும் மதிப்பாய்வு செய்கிறார்: எந்த மாதிரியும் இல்லாத, நிலையான, இயந்திரத்தனமான வாசிப்பு."

[[lines]]
id = "neurosymbolic-8"
section = "neurosymbolic"
show = "This example comes pre-encoded, so the Formalize button is switched off and we skip the drafting."
do = [{ click = "tab-source" }]
highlight = ["formalize"]
camera = "kb"

[lines.in.ta]
show = "இந்த எடுத்துக்காட்டு முன்பே குறியாக்கப்பட்டது; எனவே Formalize பொத்தான் அணைக்கப்பட்டுள்ளது, வரைவு செய்வதைத் தவிர்க்கிறோம்."

[[lines]]
id = "neurosymbolic-9"
section = "neurosymbolic"
show = "The LLM drafts. The engine decides."

[lines.in.ta]
show = "LLM வரைகிறது. இயந்திரம் தீர்மானிக்கிறது."

[[lines]]
id = "nibli-1"
section = "nibli"
show = "nibli is the engine I build in Rust."
highlight = ["brand"]

[lines.in.ta]
show = "nibli என்பது நான் Rust-இல் உருவாக்கும் இயந்திரம்."

[[lines]]
id = "nibli-2"
section = "nibli"
show = "It's a theorem prover, and it's open source."

[lines.in.ta]
show = "அது ஒரு தேற்ற நிரூபி; அது திறந்த மூலம்."

[[lines]]
id = "nibli-3"
section = "nibli"
show = "It compiles nibli KR into first-order logic, and answers claims by backward chaining over a fact store."
do = [{ click = "tab-kr" }]
highlight = ["kr", "tree"]
camera = "top"

[lines.in.ta]
show = "அது nibli KR-ஐ முதல்-வரிசைத் தர்க்கமாகத் தொகுத்து, ஒரு உண்மைக் களஞ்சியத்தின் மீது பின்னோக்கிச் சங்கிலியிட்டு, கூற்றுகளுக்குப் பதிலளிக்கிறது."

[[lines]]
id = "nibli-4"
section = "nibli"
show = "The whole pipeline, parser, compiler and reasoner, runs right here in the browser as WebAssembly, and also under Wasmtime or as a native crate."
highlight = ["footer"]
camera = "full"

[lines.in.ta]
show = "பகுப்பி, தொகுப்பி, தர்க்க இயந்திரம் என்ற முழுக் குழாய்வழியும் இங்கேயே உலாவியில் WebAssembly ஆக இயங்குகிறது; Wasmtime-இன் கீழும், ஒரு native crate ஆகவும் இயங்கும்."

[[lines]]
id = "nibli-5"
section = "nibli"
show = "It never invents a fact, a rule or a proof step."

[lines.in.ta]
show = "அது ஒருபோதும் ஒரு உண்மையையோ, விதியையோ, நிரூபணப் படியையோ கற்பனை செய்வதில்லை."

[[lines]]
id = "syllogism-1"
section = "syllogism"
show = "Here's the syllogism example: three lines of nibli KR."
highlight = ["examples", "kr-line-1", "kr-line-3", "kr-line-5"]
camera_vertical = "kb"

[lines.in.ta]
show = "இதோ syllogism எடுத்துக்காட்டு: nibli KR-இன் மூன்று வரிகள்."

[[lines]]
id = "syllogism-2"
section = "syllogism"
show = "The first reads: for every X, if X is a dog, then X is an animal."
do = [{ click = "tab-back-translation" }]
highlight = ["bt-line-0"]
camera = "kb"

[lines.in.ta]
show = "முதல் வரி: ஒவ்வொரு X-க்கும், X ஒரு நாய் என்றால், X ஒரு விலங்கு."

[[lines]]
id = "syllogism-3"
section = "syllogism"
show = "The second: for every X, if X is an animal, then X eats."
highlight = ["bt-line-1"]
camera = "kb"

[lines.in.ta]
show = "இரண்டாவது: ஒவ்வொரு X-க்கும், X ஒரு விலங்கு என்றால், X உண்ணும்."

[[lines]]
id = "syllogism-4"
section = "syllogism"
show = "The third: Adam is a dog."
highlight = ["bt-line-2"]
camera = "kb"

[lines.in.ta]
show = "மூன்றாவது: Adam ஒரு நாய்."

[[lines]]
id = "syllogism-5"
section = "syllogism"
show = "We don't ask a question. We state the claim to check: Adam eats."
highlight = ["query-select", "query-gloss"]
camera = "query"

[lines.in.ta]
show = "நாம் கேள்வி கேட்பதில்லை. சரிபார்க்க வேண்டிய கூற்றைச் சொல்கிறோம்: Adam உண்ணும்."

[[lines]]
id = "reasoning-1"
section = "reasoning"
show = "The engine starts from the claim and works backward."
do = [{ click = "tab-kr" }]
highlight = ["row-eats"]
camera = "right"

[lines.in.ta]
show = "இயந்திரம் கூற்றிலிருந்து தொடங்கி பின்னோக்கிச் செல்கிறது."

[[lines]]
id = "reasoning-2"
section = "reasoning"
show = "The goal is: Adam eats. No stored fact says so."
highlight = ["row-eats"]
camera = "proof"

[lines.in.ta]
show = "இலக்கு: Adam உண்ணும். சேமிக்கப்பட்ட எந்த உண்மையும் அப்படிச் சொல்லவில்லை."

[[lines]]
id = "reasoning-3"
section = "reasoning"
show = "So it looks for a rule whose conclusion is eats: line two, every animal eats."
highlight = ["kr-line-3", "row-eats"]
camera = "top"
camera_vertical = "kb"

[lines.in.ta]
show = "எனவே 'உண்ணும்' என்று முடியும் விதியைத் தேடுகிறது: இரண்டாம் வரி, ஒவ்வொரு விலங்கும் உண்ணும்."

[[lines]]
id = "reasoning-4"
section = "reasoning"
show = "Matching that conclusion to the goal binds X to Adam, and leaves a new goal: Adam is an animal."
highlight = ["row-animal"]
camera = "proof"

[lines.in.ta]
show = "அந்த முடிவை இலக்குடன் பொருத்தும்போது X என்பது Adam ஆகிறது; ஒரு புதிய இலக்கு மிஞ்சுகிறது: Adam ஒரு விலங்கு."

[[lines]]
id = "reasoning-5"
section = "reasoning"
show = "Again there's no stored fact, so it looks for a rule that concludes animal: line one, every dog is an animal."
highlight = ["kr-line-1", "row-animal"]
camera = "top"
camera_vertical = "kb"

[lines.in.ta]
show = "மீண்டும் சேமிக்கப்பட்ட உண்மை இல்லை; எனவே 'விலங்கு' என்று முடியும் விதியைத் தேடுகிறது: முதல் வரி, ஒவ்வொரு நாயும் ஒரு விலங்கு."

[[lines]]
id = "reasoning-6"
section = "reasoning"
show = "That leaves one goal, Adam is a dog, and that one is stored."
highlight = ["kr-line-5", "row-given"]
camera = "top"
camera_vertical = "kb"

[lines.in.ta]
show = "இப்போது ஒரே இலக்கு மிஞ்சுகிறது: Adam ஒரு நாய். அது சேமிக்கப்பட்டுள்ளது."

[[lines]]
id = "reasoning-7"
section = "reasoning"
show = "The chain closes in two rule steps."
highlight = ["row-eats", "row-animal", "row-given"]
camera = "proof"

[lines.in.ta]
show = "இரண்டு விதிப் படிகளில் சங்கிலி நிறைவடைகிறது."

[[lines]]
id = "reasoning-8"
section = "reasoning"
show = "To find the shortest chain, the engine first runs a cheap search without recording, raising the depth limit one step at a time until the claim resolves."
camera = "proof"

[lines.in.ta]
show = "மிகக் குறுகிய சங்கிலியைக் கண்டறிய, இயந்திரம் முதலில் பதிவு செய்யாமல் ஒரு மலிவான தேடலை இயக்குகிறது; கூற்று தீரும் வரை ஆழ வரம்பை ஒவ்வொரு படியாக உயர்த்துகிறது."

[[lines]]
id = "trace-1"
section = "trace"
show = "Then it runs the search once more at that depth, this time recording every step. That record is the proof trace."
highlight = ["tree"]
camera = "proof"

[lines.in.ta]
show = "பிறகு அதே ஆழத்தில் தேடலை மீண்டும் ஒருமுறை இயக்குகிறது; இந்த முறை ஒவ்வொரு படியையும் பதிவு செய்கிறது. அந்தப் பதிவே நிரூபணத் தடம்."

[[lines]]
id = "trace-2"
section = "trace"
show = "The stored fact becomes a leaf, marked given."
highlight = ["row-given"]
camera = "proof"

[lines.in.ta]
show = "சேமிக்கப்பட்ட உண்மை ஒரு இலையாகிறது; given என்று குறிக்கப்படுகிறது."

[[lines]]
id = "trace-3"
section = "trace"
show = "Each rule step becomes a node that cites the source line it used."
highlight = ["row-eats", "row-animal"]
camera = "proof"

[lines.in.ta]
show = "ஒவ்வொரு விதிப் படியும், தான் பயன்படுத்திய மூல வரியைச் சுட்டும் ஒரு கணுவாகிறது."

[[lines]]
id = "trace-4"
section = "trace"
show = "“Adam eats” cites recorded source #1: every animal eats."
highlight = ["row-eats"]
camera = "proof"

[lines.in.ta]
show = "“Adam உண்ணும்” என்பது பதிவான மூலம் #1-ஐச் சுட்டுகிறது: ஒவ்வொரு விலங்கும் உண்ணும்."
say = "Adam உண்ணும் என்பது பதிவான மூலம் எண் ஒன்றைச் சுட்டுகிறது: ஒவ்வொரு விலங்கும் உண்ணும்."

[[lines]]
id = "trace-5"
section = "trace"
show = "“Adam is an animal” cites recorded source #0: every dog is an animal."
highlight = ["row-animal"]
camera = "proof"

[lines.in.ta]
show = "“Adam ஒரு விலங்கு” என்பது பதிவான மூலம் #0-ஐச் சுட்டுகிறது: ஒவ்வொரு நாயும் ஒரு விலங்கு."
say = "Adam ஒரு விலங்கு என்பது பதிவான மூலம் எண் பூஜ்ஜியத்தைச் சுட்டுகிறது: ஒவ்வொரு நாயும் ஒரு விலங்கு."

[[lines]]
id = "trace-6"
section = "trace"
show = "Open the role-level detail, and you see what those lines are made of."
do = [
  { expand = "row-detail-given", control = ".proof-disclosure" },
  { scroll_to = "row-given", within = "proof-panel", offset = 14 },
]
highlight = ["row-detail-given"]
camera = "proof"

[lines.in.ta]
show = "பங்கு-நிலை விவரத்தைத் திறந்தால், அந்த வரிகள் எதனால் ஆனவை என்று தெரியும்."

[[lines]]
id = "trace-7"
section = "trace"
show = "The fact is stored as an event with named roles: the dog, Adam, and a breed nobody specified."
highlight = ["rows-roles"]
camera = "proof"

[lines.in.ta]
show = "அந்த உண்மை பெயரிடப்பட்ட பங்குகளுடன் ஒரு நிகழ்வாகச் சேமிக்கப்படுகிறது: நாய், Adam, யாரும் குறிப்பிடாத ஒரு இனம்."

[[lines]]
id = "trace-8"
section = "trace"
show = "When the same sub-goal comes up again, the trace says “proved above” and points back, instead of proving it twice."
do = [{ scroll_to = "rows-proved", within = "proof-panel", offset = 14 }]
highlight = ["rows-proved"]
camera = "proof"

[lines.in.ta]
show = "அதே துணை இலக்கு மீண்டும் வரும்போது, தடம் “proved above” என்று சொல்லிப் பின்னால் சுட்டுகிறது; இருமுறை நிரூபிப்பதில்லை."

[[lines]]
id = "trace-9"
section = "trace"
show = "The playground folds the whole record into the three lines you saw, with a plain-English why."
do = [
  { collapse = "row-detail-given", control = ".proof-disclosure" },
  { scroll = "proof-panel", top = 0 },
]
highlight = ["why", "row-eats", "row-animal", "row-given"]
camera = "proof"

[lines.in.ta]
show = "playground முழுப் பதிவையும் நீங்கள் பார்த்த மூன்று வரிகளாக மடிக்கிறது; எளிய ஆங்கிலத்தில் ஒரு 'ஏன்' விளக்கத்துடன்."

[[lines]]
id = "false-1"
section = "false"
show = "Now the claim that Adam is a bird."
do = [{ select = "query-select", value = "2" }]
highlight = ["query-select"]

[lines.in.ta]
show = "இப்போது, Adam ஒரு பறவை என்ற கூற்று."

[[lines]]
id = "false-2"
section = "false"
show = "Nothing in the knowledge base supports it, so the answer is FALSE."
highlight = ["row-failed", "verdict"]
camera = "right"

[lines.in.ta]
show = "அறிவுத் தளத்தில் எதுவும் அதை ஆதரிக்கவில்லை; எனவே பதில் FALSE."

[[lines]]
id = "false-3"
section = "false"
show = "The why line says no example could be found that satisfies the claim."
highlight = ["why"]
camera = "proof"

[lines.in.ta]
show = "கூற்றை நிறைவு செய்யும் எந்த எடுத்துக்காட்டும் கிடைக்கவில்லை என்று 'ஏன்' வரி சொல்கிறது."

[[lines]]
id = "false-4"
section = "false"
show = "Here, FALSE means not derivable from what we asserted. It isn't a proof that Adam isn't a bird."
highlight = ["row-failed"]
camera = "proof"

[lines.in.ta]
show = "இங்கே FALSE என்றால், நாம் உறுதிப்படுத்தியவற்றிலிருந்து நிறுவ முடியாது என்று பொருள். Adam ஒரு பறவை அல்ல என்பதற்கான நிரூபணம் அல்ல."

[[lines]]
id = "false-5"
section = "false"
show = "nibli won't claim more than its premises support."

[lines.in.ta]
show = "தன் முற்கோள்கள் ஆதரிப்பதை விட அதிகமாக nibli எதையும் கூறாது."

[[lines]]
id = "end-1"
section = "end"
show = "Try it at dhilipsiva.dev/nibli-playground. The code is on GitHub."
scene = "end"

[lines.in.ta]
show = "dhilipsiva.dev/nibli-playground-இல் முயன்று பாருங்கள். நிரல் GitHub-இல் உள்ளது."
say = "dhilipsiva dot dev slash nibli playground-இல் முயன்று பாருங்கள். நிரல் GitHub-இல் உள்ளது."

[[lines]]
id = "end-2"
section = "end"
show = "It's also the running example in my book, Ultimate Neuro-Symbolic Reasoning for AI Engineers, scheduled for December 2026."
scene = "end"

[lines.in.ta]
show = "இது என் புத்தகத்திலும் தொடர் எடுத்துக்காட்டாக வருகிறது: Ultimate Neuro-Symbolic Reasoning for AI Engineers; டிசம்பர் 2026-இல் வெளியாகத் திட்டமிடப்பட்டுள்ளது."

[[lines]]
id = "end-3"
section = "end"
show = "I'm dhilipsiva."
scene = "end"

[lines.in.ta]
show = "நான் dhilipsiva."

[[lines]]
id = "short-end"
section = "end"
show = "That was the short version. The five-minute walkthrough goes through every step."
scene = "more"
only = ["short"]

# The live playground, captured at 1280×720 CSS pixels and 3× density.
[scenes.playground]
kind = "web"
url = "https://dhilipsiva.dev/nibli-playground"
viewport = [1280, 720]
scale = 3
color_scheme = "dark"
default_camera = "app"
vertical_follows_highlights = 760
setup = [{ wait = "app-shell" }, { select = "examples", value = "0" }, { wait = "result" }]

[scenes.playground.targets]
# Regions the cameras frame
header = { css = ".app-header", pick = "first" }
kb = { css = ".main-row .col-tabs", pick = "first" }
proof = { css = ".main-row .col-proof", pick = "first" }
query = { css = ".query-row .col-tabs", pick = "first" }
log = { css = ".output-log-container", pick = "first" }
top = { css = ".main-row", pick = "first" }
# What the narration points at
kr = { css = ".main-row .col-tabs .kr-editor" }
kr-line-1 = { css = "#kb-kr-highlight", line = 1 }
kr-line-3 = { css = "#kb-kr-highlight", line = 3 }
kr-line-5 = { css = "#kb-kr-highlight", line = 5 }
kb-status = { css = ".kb-status-summary" }
source-text = { css = ".main-row .col-tabs textarea" }
examples = { css = ".app-header__examples" }
brand = { css = ".app-header__brand" }
footer = { css = "body *", text = { contains = "compiled to WebAssembly" }, pick = "last" }
query-select = { css = ".query-select" }
query-gloss = { css = ".query-gloss" }
why = { css = ".proof-why" }
tree = { css = ".proof-tree" }
row-eats = { css = ".proof-row", text_of = ":scope > .proof-label", text = { starts_with = "Adam eats" }, pick = "first" }
row-animal = { css = ".proof-row", text_of = ":scope > .proof-label", text = { starts_with = "Adam is an animal" }, pick = "first" }
row-given = { css = ".proof-row", text_of = ":scope > .proof-label", text = { starts_with = "Adam is a dog" }, pick = "first" }
row-detail-given = { css = ".proof-node.proof-asserted:not(.proof-leaf) > .proof-children > .proof-role-detail > .proof-row", pick = "first" }
rows-roles = { css = ".proof-row", text_of = ":scope > .proof-label", text = { starts_with = "Asserted: dog" }, merge = true }
rows-proved = { css = ".proof-row", text_of = ":scope > .proof-label", text = { starts_with = "(proved above)" }, merge = true }
row-failed = { css = ".proof-node.proof-failed > .proof-row" }
verdict = { css = ".output-entry", pick = "last" }
# What actions use
app-shell = { css = ".app-shell" }
result = { css = ".output-result", pick = "last" }
tab-kr = { css = ".main-row .col-tabs button", text = { starts_with = "nibli KR" } }
tab-source = { css = ".main-row .col-tabs button", text = "Source" }
tab-back-translation = { css = ".main-row .col-tabs button", text = "Back-translation" }
proof-panel = { css = ".col-proof .proof-panel", pick = "first" }
# What the expectations read
why-text = { css = ".proof-why-text", pick = "first" }
proof-rows = { css = ".proof-tree > .proof-node .proof-row", text_of = ":scope > .proof-label", exclude = { starts_with = "role-level" } }
bt-texts = { css = ".main-row .col-tabs .tab-content *", text = { matches = '^(For every X|Adam is a dog\.$)' }, unique = true }

[scenes.playground.targets.formalize]
any = [
  { css = ".main-row .col-tabs button", text = "Formalize" },
  { css = ".main-row .col-tabs button", attr = { name = "title", matches = '(?i)configure llm' } },
]

[scenes.playground.targets.bt-line-0]
css = ".main-row .col-tabs .tab-content *"
text = "For every X, if X is a dog, then X is an animal."
pick = "last"
grow = { within = ".main-row .col-tabs .tab-content", max_height = 70, margin = 8 }

[scenes.playground.targets.bt-line-1]
css = ".main-row .col-tabs .tab-content *"
text = "For every X, if X is an animal, then X eats."
pick = "last"
grow = { within = ".main-row .col-tabs .tab-content", max_height = 70, margin = 8 }

[scenes.playground.targets.bt-line-2]
css = ".main-row .col-tabs .tab-content *"
text = "Adam is a dog."
pick = "last"
grow = { within = ".main-row .col-tabs .tab-content", max_height = 70, margin = 8 }

[scenes.playground.cameras]
full = { viewport = true, vertical = "proof" }
app = { union = ["header", "kb", "proof", "query", "log"], vertical = "proof" }
top = { union = ["top"], vertical = "proof" }
kb = { union = ["kb"] }
proof = { union = ["proof"] }
query = { union = ["query"] }
log = { union = ["log"] }
left = { union = ["kb", "query"] }
right = { union = ["proof", "log"] }

# Cards and overlays: one HTML file, rendered for each cut.
[scenes.intro]
kind = "page"
url = "cards/card.html?v=intro&r={aspect}"

[scenes.end]
kind = "page"
url = "cards/card.html?v=end&r={aspect}"

# The short's own cards, drawn from the theme's templates: they are laid
# out clear of what the apps cover, which a page can't know.
[scenes.hook]
kind = "card"
template = "title"
title = "A proof you can check"
subtitle = "the nibli syllogism, in under a minute"

[scenes.more]
kind = "card"
template = "end"
title = "Run the proof yourself"
subtitle = "dhilipsiva.dev/nibli-playground"

# Overlays, drawn by vidni from their parts.
[scenes.verdicts]
kind = "overlay"
template = "chips"

[[scenes.verdicts.parts]]
label = "TRUE"
text = "a proof exists"
sign = "⊤"
tone = "good"

[[scenes.verdicts.parts]]
label = "FALSE"
text = "not derivable"
sign = "⊥"
tone = "bad"

[[scenes.verdicts.parts]]
label = "UNKNOWN"
text = "with a reason"
sign = "?"
tone = "warn"

[[scenes.verdicts.parts]]
label = "RESOURCE_EXCEEDED"
text = "a budget ran out"
sign = "◴"
tone = "accent"

[scenes.firewall]
kind = "overlay"
template = "flow"

[[scenes.firewall.parts]]
