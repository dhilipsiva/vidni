#:schema https://raw.githubusercontent.com/dhilipsiva/vidni/main/docs/vidni.schema.json
# Neuro-Symbolic Lesson 2. Synthetic review narration; stable V17a line IDs.
schema = 1

[meta]
title = "Introducing Nibli KR"
subtitle = "Reasoning from First Principles"
language = "en"
strict = true
default_scene = "v17a-shop-01"

[voice]
draft = "piper:en_US-joe-medium"
length_scale = 1.04
read_as = [
  { text = "ParcelA", say = "Parcel A" },
  { text = "PackedParcels", say = "Packed Parcels" },
]
respell = [
  { text = "Nibli KR", say = "Nibli K R" },
  { text = "ParcelA", say = "Parcel A" },
  { text = "PackedParcels", say = "Packed Parcels" },
  { text = "Parcel A", say = "Parcel, A" },
  { text = "Here it is in Nibli K R.", say = "Here it is in Nibbly K R." },
]
heard_as = [
  { heard = "nibbly", means = "nibli" },
  { heard = "nibley", means = "nibli" },
  { heard = "nibali", means = "nibli" },
  { heard = "2", means = "two" },
  { heard = "3", means = "three" },
  { heard = "7", means = "seven" },
]

# Normal speech/transition spacing only: no audience response holds.
[timing]
lead_in = 0.6
line_gap = 0.44
section_gap = 0.75
tail = 1.2

[lint]
banned = [
  'zero[- ]hallucination',
  'no hallucination',
  'cannot hallucinate',
  'guarantee',
  'UNDETERMINED',
  '\bask(?:s|ed|ing)?\b',
  '\bquestions?\b',
  '\bpause and\b',
  '\bpredict\b',
]

[style]
theme = "../themes/quine"

[[cuts]]
id = "long"
aspect = "16:9"
captions = "both"
platforms = ["youtube"]

[[cuts]]
id = "short"
aspect = "9:16"
captions = "burned"
platforms = ["youtube-shorts"]

[music]
track = "none"

[publish]
description = "A parcel, the note about it and a formal statement are different things. Neuro-Symbolic Lesson 2 introduces knowledge representation through a small shop and its parcel records. Nibli KR is the language used to write the records; Nibli is the engine that evaluates claims against supplied records and rules. Writing a note formally does not establish that the note is correct. This course builds from everyday examples of symbolic reasoning toward combining it with neural AI. No formal logic or programming background is required. Narrated by the course creator. The shop is a fictional teaching example."
tags = [
  "neuro-symbolic reasoning",
  "symbolic reasoning",
  "knowledge representation",
  "Nibli KR",
  "logic",
]
links = [
  { label = "Nibli engine and language", url = "https://github.com/dhilipsiva/nibli/blob/1eab5d1f1d52d1c106145aa0cbc18205ff9b0902/README.md" },
]
thumbnails = [{ line = "v17a-language-and-engine-04", title = "The language and the engine" }]

[publish.titles]
youtube = "Introducing Nibli KR: From Records to Reasoning | Neuro-Symbolic Lesson 2"
youtube-shorts = "Nibli and Nibli KR: Two Different Jobs | Neuro-Symbolic Lesson 2"

