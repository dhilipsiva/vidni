scene = "v03a-host-and-next-04"
only = ["long"]

[[lines]]
id = "v03a-host-and-next-05"
emphasis = [{ id = "focus-1", target = "focus", phrase = "period" }]
section = "host-and-next"
show = "The period remains in both forms."
source = "notes.md#v03a-host-and-next"
scene = "v03a-host-and-next-05"
only = ["long"]

[[lines]]
id = "v03a-host-and-next-06"
section = "host-and-next"
show = "An evaluation can also stop without deciding; we'll explain those outcomes later."
source = "notes.md#v03a-host-and-next"
scene = "v03a-host-and-next-06"
only = ["long"]

[[lines]]
id = "v03a-host-and-next-07"
section = "host-and-next"
show = "Today, we've written records with clear names and roles, supplied premises, and evaluated claims against them."
source = "notes.md#v03a-host-and-next"
scene = "v03a-host-and-next-07"
only = ["long"]

[[lines]]
id = "v03a-host-and-next-08"
