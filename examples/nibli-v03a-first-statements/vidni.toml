only = ["long"]

[[lines]]
id = "v03a-refusals-08"
emphasis = [{ id = "focus-1", target = "focus", phrase = "two places" }]
section = "refusals"
show = "And member has two places."
source = "notes.md#v03a-refusals"
scene = "v03a-refusals-08"
only = ["long"]

[[lines]]
id = "v03a-refusals-09"
emphasis = [{ id = "focus-1", target = "focus", phrase = "third argument" }]
