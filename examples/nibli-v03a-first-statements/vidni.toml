only = ["long"]

[[lines]]
id = "v03a-supplied-conclusion-01"
emphasis = [{ id = "focus-1", target = "cue-focus-1", phrase = "desired claim" }]
camera = "shot"
camera_vertical = "portrait"
section = "supplied-conclusion"
show = "There is an easy way to get a misleading success: put the desired claim into the premises."
