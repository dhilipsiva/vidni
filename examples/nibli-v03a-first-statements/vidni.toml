schema = 1
[meta]
title = "Writing Your First Nibli KR Statements"
subtitle = "Reasoning from First Principles"
language = "en"
strict = true
default_scene = "v03a-shop-01"

[voice]
draft = "piper:en_US-joe-medium"
length_scale = 1.04
respell = [{ text = "Nibli KR", say = "Nibbly K R" }, { text = "Nibli", say = "Nibbly" }, { text = "Parcel A", say = "Parcel, A" }]
heard_as = [{ heard = "nibbly", means = "nibli" }, { heard = "nibley", means = "nibli" }]

[emphasis]
min_duration = 3.0

[timing]
lead_in = 0.6
line_gap = 0.32
section_gap = 0.65
tail = 1.2

[style]
theme = "../themes/quine"

[lint]
banned = ['\bask(?:s|ed|ing)?\b', '\bquestions?\b', '\bpause and\b', '\bpredict\b', 'UNDETERMINED']

[[cuts]]
id = "long"
aspect = "16:9"
captions = "both"
platforms = ["youtube"]

[[cuts]]
id = "short"
aspect = "9:16"
captions = "burned"
platforms = ["youtube-shorts"]

[music]
track = "none"

[publish]
description = "Neuro-Symbolic Lesson 3 introduces writing Nibli KR statements through parcel records, named and positional arguments, reviewed premises and actual claim evaluation. The shop is a fictional teaching example. Lesson 4 continues with the same parcels and adds a rule."
tags = ["neuro-symbolic reasoning", "Nibli KR", "symbolic reasoning", "knowledge representation"]

[publish.titles]
youtube = "Writing Your First Nibli KR Statements | Neuro-Symbolic Lesson 3"
youtube-shorts = "Same Statement, Different Job: Premise or Claim | Neuro-Symbolic Lesson 3"

[sections.shop]
label = ""
chapter = "Two parcels and their records"

[sections.build-statement]
label = ""
chapter = "Writing the first statement"

[sections.named-places]
label = ""
chapter = "Positions and named arguments"

[sections.supply-premises]
label = ""
chapter = "Supplying and reviewing premises"

[sections.evaluate-claims]
label = ""
chapter = "Evaluating claims and their support"

[sections.supplied-conclusion]
label = ""
chapter = "Supplying a desired conclusion"

[sections.refusals]
label = ""
chapter = "Refusals and repairs"

[sections.host-and-next]
label = ""
chapter = "Interfaces and the next lesson"

[sections.short-story]
label = ""
chapter = ""

