scene = "v03a-supplied-conclusion-01"
only = ["long"]

[[lines]]
id = "v03a-supplied-conclusion-02"
emphasis = [{ id = "focus-1", target = "cue-focus-1", phrase = "labelled-parcels list" }]
camera = "shot"
camera_vertical = "portrait"
section = "supplied-conclusion"
show = "In a separate copy of our example, we add a line saying that Parcel A belongs to the labelled-parcels list, review that change, and evaluate it again."
source = "notes.md#v03a-supplied-conclusion"
scene = "v03a-supplied-conclusion-02"
only = ["long"]

[[lines]]
id = "v03a-supplied-conclusion-03"
emphasis = [{ id = "focus-1", target = "cue-focus-1", phrase = "TRUE" }, { id = "focus-2", target = "cue-focus-2", phrase = "supplied that very statement" }]
camera = "shot"
camera_vertical = "portrait"
section = "supplied-conclusion"
show = "Now it is TRUE because we supplied that very statement."
source = "notes.md#v03a-supplied-conclusion"
scene = "v03a-supplied-conclusion-03"
only = ["long"]

[[lines]]
id = "v03a-supplied-conclusion-04"
emphasis = [{ id = "focus-1", target = "focus", phrase = "observation" }]
section = "supplied-conclusion"
show = "That hasn't produced a missing observation."
source = "notes.md#v03a-supplied-conclusion"
scene = "v03a-supplied-conclusion-04"
only = ["long"]

[[lines]]
id = "v03a-supplied-conclusion-05"
emphasis = [{ id = "focus-1", target = "cue-focus-1", phrase = "starting information" }]
camera = "shot"
camera_vertical = "portrait"
section = "supplied-conclusion"
show = "It has changed the starting information."
source = "notes.md#v03a-supplied-conclusion"
scene = "v03a-supplied-conclusion-05"
only = ["long"]

[[lines]]
id = "v03a-supplied-conclusion-06"
camera = "shot"
camera_vertical = "portrait"
section = "supplied-conclusion"
show = "We return to the original two records."
source = "notes.md#v03a-supplied-conclusion"
scene = "v03a-supplied-conclusion-06"
only = ["long"]

[[lines]]
id = "v03a-supplied-conclusion-07"
camera = "shot"
camera_vertical = "portrait"
