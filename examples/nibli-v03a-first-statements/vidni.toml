camera = "shot"
camera_vertical = "portrait"
section = "refusals"
show = "Packed is ordinary English, but it isn't a predicate in the supported vocabulary for this build."
source = "notes.md#v03a-refusals"
scene = "v03a-refusals-05"
only = ["long"]

[[lines]]
id = "v03a-refusals-06"
