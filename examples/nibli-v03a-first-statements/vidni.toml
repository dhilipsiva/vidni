scene = "v03a-refusals-02"
only = ["long"]

[[lines]]
id = "v03a-refusals-03"
emphasis = [{ id = "focus-1", target = "focus", phrase = "Restoring it" }]
section = "refusals"
show = "Restoring it repairs the syntax; it doesn't change the packing note's meaning."
