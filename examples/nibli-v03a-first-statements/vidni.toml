only = ["long"]

[[lines]]
id = "v03a-refusals-11"
emphasis = [{ id = "focus-1", target = "focus", phrase = "original statement" }]
section = "refusals"
show = "We remove the extra argument to recover our original statement."
source = "notes.md#v03a-refusals"
scene = "v03a-refusals-11"
only = ["long"]

[[lines]]
id = "v03a-refusals-12"
