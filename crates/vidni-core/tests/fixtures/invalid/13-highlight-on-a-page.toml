url = "https://example.com"

[scenes.page.targets]
title = { css = "h1" }

[scenes.page.cameras]
heading = { union = ["title"] }

[scenes.card]
kind = "page"
url = "cards/card.html"

[[cuts]]
id = "long"
aspect = "16:9"
