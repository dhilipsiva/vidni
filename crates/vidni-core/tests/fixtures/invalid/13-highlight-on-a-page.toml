# expect: 20:13: highlight needs a web scene, and "card" is a page scene
schema = 1

[meta]
title = "A broken project"
default_scene = "page"

[sections.main]

[[lines]]
id = "main-1"
section = "main"
show = "Hello."

[[lines]]
id = "main-2"
section = "main"
show = "A card."
scene = "card"
