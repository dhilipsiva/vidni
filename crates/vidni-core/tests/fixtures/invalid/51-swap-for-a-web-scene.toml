# expect: 37:17: "site" is a web scene, and a cut can't swap one in: a web scene's stills are of one page, in script order
schema = 1

[meta]
title = "Swaps"
default_scene = "wide"

[sections.main]

[[lines]]
id = "main-1"
section = "main"
show = "A session."
camera = "top"

[scenes.wide]
kind = "terminal"
url = "diagram.svg"

[scenes.wide.targets]
top = { lines = [1, 2] }

[scenes.wide.cameras]
top = { union = ["top"] }

[scenes.narrow]
kind = "terminal"
url = "diagram.svg"

[scenes.site]
kind = "web"
url = "https://example.com"

[[cuts]]
id = "long"
aspect = "16:9"
swap = { wide = "site" }
