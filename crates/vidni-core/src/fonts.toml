# The fonts vidni draws with (TODO.md, P3-VIDNI-06; DECISIONS.md, D12).
#
# Each file is pinned by size and SHA-256, so that a frame's text is the
# same wherever it is drawn. vidni's flake provides these files, and
# `VIDNI_FONTS` names the folders that hold them. A file with the right
# name and other bytes is refused.

[[font]]
id = "ibm-plex-sans-bold"
family = "IBM Plex Sans"
style = "Bold"
version = "1.1.0"
file = "IBMPlexSans-Bold.otf"
size = 140656
sha256 = "19de5aec74215119b3f8f7d1b1f0e0eba867bee2d2c65c5761b287d67581c316"
licence = "OFL-1.1"
source = "https://github.com/IBM/plex"

