# Platform profiles (TODO.md, P2-VIDNI-07). Each profile was checked on its
# `verified_on` date against its sources, official pages first. Platforms
# change their limits without notice: confirm a limit in the app before
# relying on it, and update the profile and its date when it changes.
#
# Durations are in seconds and sizes in megabytes (10^6 bytes). None of
# these platforms publishes a loudness target for uploads: YouTube's -14 LUFS
# is an independent measurement, and the others use vidni's default (-14 LUFS,
# -1 dBTP), so one master suits every platform. The safe zones come from each
# platform's ads guidance; none publishes margins for ordinary posts.

[[platform]]
id = "youtube"
name = "YouTube"
enabled_by_default = true
aspect = "16:9"
resolution = [1920, 1080]
max_upload = 900
max_size_mb = 256000
loudness = { integrated = -14.0, true_peak = -1.0, basis = "measured" }
captions = "file"
safe_zone = { top = 0.0, bottom = 0.0, left = 0.0, right = 0.0, basis = "none" }
verified_on = "2026-11-13"
sources = [
  "https://support.google.com/youtube/answer/71673",
  "https://support.google.com/youtube/answer/171664",
  "https://support.google.com/youtube/answer/6375112",
  "https://support.google.com/youtube/answer/2734698",
  "https://www.meterplugs.com/blog/2019/09/18/youtube-changes-loudness-reference-to-14-lufs.html",
]
notes = [
  "15 minutes is the default; an account that verifies a phone number can upload up to 12 hours or 256 GB, whichever is less.",
  "YouTube publishes no loudness target; -14 LUFS is an independent measurement of its playback normalization (2019).",
  "Caption files (SRT, VTT and others) are uploaded in YouTube Studio.",
]

