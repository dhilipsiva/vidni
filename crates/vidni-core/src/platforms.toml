  "The safe zone is Google's for Shorts ads: 288 px top, 672 px bottom, 48 px left, 192 px right at 1080x1920.",
  "Captions are burned in: vidni's shorts are always captioned (DECISIONS.md, D7), and caption-file upload isn't documented for Shorts.",
]

