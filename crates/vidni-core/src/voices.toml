# The draft voices vidni can fetch, as voice packs (TODO.md, P3-VIDNI-03).
#
# Each pack pins its files by size and SHA-256, at one revision of their
# repository, and says what its model card gives as the licence: the
# training data's licence, and whether that allows commercial use. Each
# entry was read off its model card on the date in `checked`. `vidni
# validate` warns when a project's draft voice doesn't allow commercial use.

