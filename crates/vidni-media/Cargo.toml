[package]
name = "vidni-media"
description = "vidni's media stages: compose, encode, QA, TTS, capture and the intelligibility check, driving pinned external tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
harfrust = "0.5.2"
hound = "3.5.1"
libm = "0.2.16"
png = "0.18.1"
resvg = { version = "0.49.0", default-features = false, features = ["text"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "3.27.0"
ttf-parser = "0.25.1"
vidni-core = { path = "../vidni-core" }

[target.'cfg(unix)'.dependencies]
# Chromium is handed its pipes by descriptor number, which Unix can do.
command-fds = "0.3.3"

[dev-dependencies]
