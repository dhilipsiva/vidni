[package]
name = "vidni-cli"
description = "The vidni command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "vidni_cli"
path = "src/lib.rs"

[[bin]]
name = "vidni"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
ruzstd = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.44"
tempfile = "3.27.0"
vidni-core = { path = "../vidni-core" }
vidni-media = { path = "../vidni-media" }
vidni-record = { path = "../vidni-record" }

[dev-dependencies]
hound = "3.5.1"
portable-pty = "0.9.0"
